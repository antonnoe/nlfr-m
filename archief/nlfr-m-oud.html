document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px;\">Oudere berichten op de site →<\u002Fa>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ opActueel }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation: rise .35s ease both;\">\n<div style=\"padding: 4px 16px 0;\">\n<h1 style=\"margin: 0; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 23px; line-height: 1.2; letter-spacing: -.02em; color: #241c1c;\">Nu actueel<\u002Fh1>\n<p style=\"margin: 5px 0 0; font-size: 13px; line-height: 1.5; color: #6f6663;\">Frankrijknieuws uit officiële bronnen en pers, samengesteld door de redactie.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin: 12px 12px 0; border-radius: 16px; overflow: hidden; background: #fff; border: 1px solid rgba(21,24,26,.10);\">\n<iframe src=\"{{ actueelUrl }}\" ref=\"{{ actueelRef }}\" sc-camel-on-load=\"{{ actueelGeladen }}\" title=\"Actueel — Frankrijknieuws\" loading=\"lazy\" style=\"{{ actueelStijl }}\"><\u002Fiframe>\n<\u002Fdiv>\n<div style=\"padding: 12px 16px 0; text-align: center;\">\n<a href=\"https://nlfr-menu.vercel.app/actueel\" target=\"_top\" style=\"font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px;\">Open op een eigen pagina →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ aanmeldOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(36,28,28,.42);\">\n<div sc-camel-on-click=\"{{ sluitAanmelden }}\" style=\"flex: 1 1 auto; cursor: pointer;\"><\u002Fdiv>\n<div style=\"flex: 0 0 auto; background: #fdf9f8; border-radius: 20px 20px 0 0; padding: 8px 18px 24px; box-shadow: 0 -10px 34px rgba(60,20,20,.18);\">\n<div sc-camel-on-click=\"{{ sluitAanmelden }}\" style=\"width: 42px; height: 4px; margin: 0 auto 16px; border-radius: 999px; background: rgba(128,0,0,.20); cursor: pointer;\"><\u002Fdiv>\n\n<sc-if value=\"{{ isLid }}\" hint-placeholder-val=\"{{ false }}\">\n<h2 style=\"margin: 0; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.25; letter-spacing: -.01em; color: #241c1c;\">U bent bekend als {{ lidNaam }}<\u002Fh2>\n<p style=\"margin: 7px 0 18px; font-size: 13.5px; line-height: 1.6; color: #5c5350; text-wrap: pretty;\">U kunt reageren en zelf berichten plaatsen. Deze telefoon onthoudt u, zodat u niet elke keer opnieuw hoeft aan te melden.<\u002Fp>\n<a href=\"{{ lidUrl }}\" target=\"_top\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 12px 15px; border-radius: 14px; background: #fff; border: 1px solid rgba(128,0,0,.18); color: #241c1c; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 15px;\">\n<span>Mijn profielpagina<\u002Fspan>\n<span style=\"color: #800000;\">→<\u002Fspan>\n<\u002Fa>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ nietLid }}\" hint-placeholder-val=\"{{ true }}\">\n<h2 style=\"margin: 0; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.25; letter-spacing: -.01em; color: #241c1c;\">Reageren doet u als lid<\u002Fh2>\n<p style=\"margin: 7px 0 18px; font-size: 13.5px; line-height: 1.6; color: #5c5350; text-wrap: pretty;\">Lezen kan zonder aanmelden. Wilt u reageren of zelf een bericht plaatsen, meld u dan even aan — u komt daarna terug op deze pagina.<\u002Fp>\n\n<div style=\"display: flex; flex-direction: column; gap: 9px;\">\n<a href=\"{{ aanmeldUrl }}\" target=\"_top\" style=\"display: flex; align-items: center; gap: 13px; min-height: 62px; padding: 12px 15px; border-radius: 14px; background: #800000; color: #fff;\">\n<span style=\"flex: 1 1 auto;\">\n<span style=\"display: block; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 16px;\">Ik ben al lid — aanmelden<\u002Fspan>\n<span style=\"display: block; margin-top: 2px; font-size: 12.5px; color: rgba(255,255,255,.78); font-weight: 500;\">Met uw e-mailadres en wachtwoord<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex: 0 0 auto; font-size: 16px;\">→<\u002Fspan>\n<\u002Fa>\n\n<a href=\"{{ wachtwoordUrl }}\" target=\"_top\" style=\"display: flex; align-items: center; gap: 13px; min-height: 62px; padding: 12px 15px; border-radius: 14px; background: #fff; border: 1px solid rgba(128,0,0,.20); color: #241c1c;\">\n<span style=\"flex: 1 1 auto;\">\n<span style=\"display: block; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 16px; color: #5f0000;\">Wachtwoord kwijt<\u002Fspan>\n<span style=\"display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.4; color: #6f6663; font-weight: 500;\">Vul alleen uw e-mailadres in; u krijgt een e-mail met een koppeling om een nieuw wachtwoord te kiezen. Uw profiel en berichten blijven gewoon staan.<\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n\n<a href=\"{{ inschrijfUrl }}\" target=\"_top\" style=\"display: flex; align-items: center; gap: 13px; min-height: 54px; padding: 12px 15px; border-radius: 14px; background: #fff; border: 1px solid rgba(21,24,26,.12); color: #241c1c;\">\n<span style=\"flex: 1 1 auto;\">\n<span style=\"display: block; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 16px;\">Nog geen lid — inschrijven<\u002Fspan>\n<span style=\"display: block; margin-top: 2px; font-size: 12.5px; color: #6f6663; font-weight: 500;\">Gratis, u kunt daarna meteen meepraten<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex: 0 0 auto; font-size: 16px; color: #800000;\">→<\u002Fspan>\n<\u002Fa>\n<\u002Fdiv>\n\n<p style=\"margin: 16px 0 0; font-size: 12px; line-height: 1.55; color: #8a7d79; text-wrap: pretty;\">Weet u niet meer met welk e-mailadres u destijds lid werd? Kies dan “Wachtwoord kwijt” en probeer het adres waarop u de nieuwsbrief ontvangt.<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ isLid }}\" hint-placeholder-val=\"{{ false }}\">\n<div sc-camel-on-click=\"{{ vergeetProfiel }}\" style=\"margin-top: 14px; padding-top: 13px; border-top: 1px solid rgba(128,0,0,.12); font-size: 12.5px; font-weight: 600; color: #800000; cursor: pointer; text-align: center;\">Niet {{ lidNaam }}? Deze telefoon vergeten<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 8px 12px 14px; background: linear-gradient(to top, #fdf9f8 62%, rgba(253,249,248,0));\">\n<div style=\"display: flex; gap: 6px; width: 100%; max-width: 436px; padding: 5px; border-radius: 16px; background: #fff; border: 1px solid rgba(128,0,0,.16); box-shadow: 0 6px 22px rgba(60,20,20,.10);\">\n<sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n<div sc-camel-on-click=\"{{ t.kies }}\" style=\"{{ t.stijl }}\">{{ t.label }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:880}}\">\nconst API = \"https://nlfr-berichten.vercel.app/api/berichten\";\nconst DRAAD_API = \"https://nlfr-berichten.vercel.app/api/reacties?post=\";\nconst ACTUEEL_URL = \"https://nlfr-menu.vercel.app/actueel\";\nconst ACTUEEL_ORIGIN = \"https://nlfr-menu.vercel.app\";\nconst BEZOEK_SLEUTEL = \"nlfr-m-laatstbezoek\";\nconst PROFIEL_SLEUTEL = \"nlfr-m-profiel\";\nconst NLFR = \"https://www.nederlanders.fr\";\nconst NLFR_ORIGINS = [\"https://www.nederlanders.fr\", \"https://nederlanders.fr\"];\n\n// Ning brengt de bezoeker na aanmelden terug naar de meegegeven target. Staat\n// deze pagina als iframe op Ning, dan moet dat de MOEDERpagina zijn — anders\n// verlaat men na het aanmelden de site en is de sessie hier onzichtbaar.\nfunction terugUrl(gemeld) {\n  if (gemeld) return gemeld;\n  try {\n    if (window.self !== window.top) {\n      const ref = document.referrer || \"\";\n      if (/^https:\\/\\/(www\\.)?nederlanders\\.fr\\//i.test(ref)) return ref;\n      return NLFR + \"/m\";\n    }\n    const hier = window.location.href;\n    return /^https?:\\/\\//i.test(hier) ? hier : NLFR + \"/m\";\n  } catch (e) {\n    return NLFR + \"/m\";\n  }\n}\nfunction aanmeldUrl(terug) {\n  return NLFR + \"/main/authorization/signIn?target=\" + encodeURIComponent(terugUrl(terug));\n}\nfunction inschrijfUrl(terug) {\n  return NLFR + \"/main/authorization/signUp?target=\" + encodeURIComponent(terugUrl(terug));\n}\nfunction wachtwoordUrl(terug) {\n  return NLFR + \"/main/authorization/requestPasswordReset?previousUrl=\" + encodeURIComponent(aanmeldUrl(terug));\n}\n\nfunction tijdKort(iso) {\n  if (!iso) return \"\";\n  const d = new Date(iso);\n  if (isNaN(d)) return \"\";\n  const nu = new Date();\n  const min = Math.round((nu - d) / 60000);\n  if (min < 1) return \"zojuist\";\n  if (min < 60) return min + \" min geleden\";\n  const uur = Math.round(min / 60);\n  const zelfdeDag = d.toDateString() === nu.toDateString();\n  const klok = String(d.getHours()).padStart(2, \"0\") + \":\" + String(d.getMinutes()).padStart(2, \"0\");\n  if (zelfdeDag) return \"vandaag \" + klok;\n  if (uur < 48) return \"gisteren \" + klok;\n  const dagen = Math.round(uur / 24);\n  if (dagen < 7) return dagen + \" dagen geleden\";\n  return d.getDate() + \" \" + [\"jan\", \"feb\", \"mrt\", \"apr\", \"mei\", \"jun\", \"jul\", \"aug\", \"sep\", \"okt\", \"nov\", \"dec\"][d.getMonth()];\n}\n\nfunction initialen(naam) {\n  const w = String(naam || \"\").trim().split(/\\s+/).filter(Boolean);\n  if (!w.length) return \"?\";\n  const eerste = w[0][0] || \"\";\n  const laatste = w.length > 1 ? w[w.length - 1][0] : \"\";\n  return (eerste + laatste).toUpperCase();\n}\n\nconst POSTS = [\n  { id: \"p1\", titel: \"Nieuwe regels voor de taxe d'habitation op tweede woningen\", auteur: \"Anton Noë\", initialen: \"AN\", tijd: \"vandaag 08:12\", samenvatting: \"Gemeenten mogen de opslag verder verhogen. Wat betekent dat concreet voor wie een tweede huis in Frankrijk heeft?\", nieuw: 3,\n    reacties: [\n      { auteur: \"Marijke de Bruin\", initialen: \"MB\", tijd: \"10:41\", nieuw: true, tekst: \"In onze gemeente in de Dordogne ging het vorig jaar al met 40% omhoog. Iemand ervaring met bezwaar maken?\" },\n      { auteur: \"Peter Jansen\", initialen: \"PJ\", tijd: \"11:02\", nieuw: true, tekst: \"Bezwaar kan via je espace particulier, maar alleen bij een feitelijke fout in de gegevens — niet tegen het tarief zelf.\" },\n      { auteur: \"Els Vermeer\", initialen: \"EV\", tijd: \"12:18\", nieuw: true, tekst: \"Let op dat je de déclaration d'occupation ieder jaar bijwerkt, anders krijg je automatisch het hoge tarief.\" },\n      { auteur: \"Hans Kuipers\", initialen: \"HK\", tijd: \"gisteren 19:55\", nieuw: false, tekst: \"Goed artikel. De link naar de tekst in de Journal Officiel werkt bij mij niet meer.\" }\n    ] },\n  { id: \"p2\", titel: \"Ervaringen gezocht: zonnepanelen laten plaatsen in de Occitanie\", auteur: \"Willem Doornbos\", initialen: \"WD\", tijd: \"gisteren 17:30\", samenvatting: \"We denken erover om panelen op de schuur te leggen. Wie heeft dit gedaan en wat waren de werkelijke kosten?\", nieuw: 2,\n    reacties: [\n      { auteur: \"Ria Slager\", initialen: \"RS\", tijd: \"vandaag 07:20\", nieuw: true, tekst: \"Wij hebben 6 kWp, all-in €9.400 met een RGE-installateur. De prime is inmiddels wel lager dan toen.\" },\n      { auteur: \"Gerard Bos\", initialen: \"GB\", tijd: \"vandaag 09:05\", nieuw: true, tekst: \"Vraag altijd drie devis en check of de installateur echt RGE is — anders geen premie en geen 10% btw.\" },\n      { auteur: \"Willem Doornbos\", initialen: \"WD\", tijd: \"gisteren 21:40\", nieuw: false, tekst: \"Dank alvast. Vooral benieuwd naar de terugverdientijd bij eigen verbruik.\" }\n    ] },\n  { id: \"p3\", titel: \"Waarom mijn Franse bank ineens om een belastingverklaring vroeg\", auteur: \"Corine Haan\", initialen: \"CH\", tijd: \"2 dagen geleden\", samenvatting: \"Een korte uitleg over de CRS-uitwisseling en waarom banken periodiek uw fiscale woonplaats opnieuw vaststellen.\", nieuw: 0,\n    reacties: [\n      { auteur: \"Jan Veldkamp\", initialen: \"JV\", tijd: \"eergisteren 14:12\", nieuw: false, tekst: \"Bij ons ging het net zo. Formulier invullen, kopie avis d'imposition erbij, binnen een week geregeld.\" },\n      { auteur: \"Corine Haan\", initialen: \"CH\", tijd: \"eergisteren 16:03\", nieuw: false, tekst: \"Precies. Belangrijk is dat je het niet negeert — dan blokkeren ze de rekening tijdelijk.\" }\n    ] },\n  { id: \"p4\", titel: \"Bosbrandrisico deze week: kaart en wat de niveaus betekenen\", auteur: \"Redactie NLFR\", initialen: \"RN\", tijd: \"3 dagen geleden\", samenvatting: \"Voor het zuiden geldt opnieuw een verhoogd risico. De préfectures publiceren dagelijks een kleurcode per massif.\", nieuw: 1,\n    reacties: [\n      { auteur: \"Truus Meijer\", initialen: \"TM\", tijd: \"vandaag 06:48\", nieuw: true, tekst: \"In de Var stond het gisteren op rood — wandelpaden waren dicht vanaf de ochtend.\" },\n      { auteur: \"Frank de Wit\", initialen: \"FW\", tijd: \"3 dagen geleden\", nieuw: false, tekst: \"De app van de préfecture geeft de code per massif, handig als je in de buurt van een bos woont.\" }\n    ] }\n];\n\nconst WEZEN = [\n  { auteur: \"Karin Bolt\", tijd: \"vandaag 09:33\", titel: \"reageerde op: Autoverzekering oversluiten na verhuizing\" },\n  { auteur: \"Theo Lammers\", tijd: \"gisteren 20:11\", titel: \"reageerde op: Mutuelle kiezen als zelfstandige\" }\n];\n\nclass Component extends DCLogic {\n  state = { scherm: \"start\", filter: \"alles\", open: {}, posts: null, wezen: [], laden: true, fout: null, sinds: null, actueelHoogte: 900, draden: {}, profiel: null, aanmeldOpen: false, ouderUrl: null };\n\n  // Staat deze pagina als iframe op Ning, dan stuurt de moederpagina wie er\n  // is aangemeld. Zelf kunnen we de Ning-sessie niet lezen — dat blokkeert de\n  // browser — dus we onthouden het lokaal voor volgende bezoeken.\n  luisterProfiel = (e) => {\n    if (NLFR_ORIGINS.indexOf(e.origin) === -1) return;\n    // De moederpagina mag haar eigen URL meesturen; die is het juiste\n    // terugkeeradres na aanmelden.\n    const pagina = e.data && (e.data.nlfrPagina || (e.data.nlfrProfile && e.data.nlfrProfile.pagina));\n    if (pagina && /^https:\\/\\/(www\\.)?nederlanders\\.fr\\//i.test(pagina) && pagina !== this.state.ouderUrl) {\n      this.setState({ ouderUrl: pagina });\n    }\n    const p = e.data && e.data.nlfrProfile;\n    if (!p || !p.id) return;\n    const profiel = {\n      id: p.id,\n      naam: p.naam || p.name || p.id,\n      url: p.profileUrl || p.url || NLFR + \"/profile/\" + p.id\n    };\n    try { window.localStorage.setItem(PROFIEL_SLEUTEL, JSON.stringify(profiel)); } catch (err) {}\n    this.setState({ profiel });\n  };\n\n  vergeetProfiel = () => {\n    try { window.localStorage.removeItem(PROFIEL_SLEUTEL); } catch (e) {}\n    this.setState({ profiel: null, aanmeldOpen: false });\n  };\n\n  // De volledige draad staat niet in de feeds; die lezen we per bericht op,\n  // pas op het moment dat iemand hem openklapt.\n  async haalDraad(id) {\n    if (!id || this.state.draden[id]) return;\n    this.setState((s) => ({ draden: { ...s.draden, [id]: { laden: true } } }));\n    try {\n      const r = await fetch(DRAAD_API + encodeURIComponent(id), { headers: { accept: \"application/json\" } });\n      if (!r.ok) throw new Error(\"status \" + r.status);\n      const d = await r.json();\n      if (d.status !== \"ok\" || !Array.isArray(d.reacties)) throw new Error(d.status || \"onbekend\");\n      this.setState((s) => ({\n        draden: { ...s.draden, [id]: { laden: false, reacties: d.reacties, volledig: d.volledig, verwacht: d.verwacht } }\n      }));\n    } catch (e) {\n      this.setState((s) => ({ draden: { ...s.draden, [id]: { laden: false, fout: true } } }));\n    }\n  }\n\n  // /actueel meldt zijn eigen hoogte via postMessage; wij geven onze\n  // vensterhoogte terug, precies zoals EMBED.md voorschrijft.\n  luisterActueel = (e) => {\n    if (e.origin !== ACTUEEL_ORIGIN) return;\n    const h = e.data && e.data.nlfrActueelHeight;\n    if (h && h !== this.state.actueelHoogte) this.setState({ actueelHoogte: h });\n  };\n\n  stuurVenster = () => {\n    const f = this.actueelRef && this.actueelRef.current;\n    if (!f || !f.contentWindow) return;\n    try {\n      f.contentWindow.postMessage({ nlfrViewport: window.innerHeight }, ACTUEEL_ORIGIN);\n    } catch (err) {}\n  };\n\n  componentWillUnmount() {\n    window.removeEventListener(\"message\", this.luisterActueel);\n    window.removeEventListener(\"message\", this.luisterProfiel);\n    window.removeEventListener(\"resize\", this.stuurVenster);\n  }\n\n  componentDidMount() {\n    this.actueelRef = React.createRef();\n    window.addEventListener(\"message\", this.luisterActueel);\n    window.addEventListener(\"message\", this.luisterProfiel);\n    try {\n      const bewaard = window.localStorage.getItem(PROFIEL_SLEUTEL);\n      if (bewaard) this.setState({ profiel: JSON.parse(bewaard) });\n    } catch (e) {}\n    window.addEventListener(\"resize\", this.stuurVenster);\n    let sinds = null;\n    try {\n      sinds = window.localStorage.getItem(BEZOEK_SLEUTEL);\n      window.localStorage.setItem(BEZOEK_SLEUTEL, new Date().toISOString());\n    } catch (e) {}\n    this.setState({ sinds });\n    this.haal();\n  }\n\n  async haal() {\n    try {\n      const r = await fetch(API, { headers: { accept: \"application/json\" } });\n      if (!r.ok) throw new Error(\"status \" + r.status);\n      const d = await r.json();\n      if (!d || !Array.isArray(d.berichten)) throw new Error(\"onverwacht antwoord\");\n      this.setState({ posts: d.berichten, wezen: d.wezen || [], laden: false, fout: null });\n    } catch (e) {\n      this.setState({ laden: false, fout: String(e.message || e) });\n    }\n  }\n\n  // Reacties nieuwer dan het vorige bezoek; zonder vorig bezoek: laatste 24 uur.\n  isNieuw(iso) {\n    if (!iso) return false;\n    const grens = this.state.sinds\n      ? new Date(this.state.sinds)\n      : new Date(Date.now() - 24 * 3600 * 1000);\n    return new Date(iso) > grens;\n  }\n\n  tabStijl(actief) {\n    return \"flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; \" +\n      (actief ? \"background: #800000; color: #fff;\" : \"background: transparent; color: #6f6663;\");\n  }\n\n  chipStijl(actief) {\n    return \"display: inline-flex; align-items: center; min-height: 36px; padding: 0 13px; border-radius: 999px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 12.5px; \" +\n      (actief\n        ? \"background: #800000; color: #fff; border: 1px solid #800000;\"\n        : \"background: #fff; color: #6f6663; border: 1px solid rgba(128,0,0,.16);\");\n  }\n\n  renderVals() {\n    const d = new Date();\n    const dagen = [\"zondag\", \"maandag\", \"dinsdag\", \"woensdag\", \"donderdag\", \"vrijdag\", \"zaterdag\"];\n    const maanden = [\"januari\", \"februari\", \"maart\", \"april\", \"mei\", \"juni\", \"juli\", \"augustus\", \"september\", \"oktober\", \"november\", \"december\"];\n    const { scherm, filter, open, laden, fout } = this.state;\n\n    // Bij een storing NOOIT terugvallen op voorbeelddata — dan lijken verzonnen\n    // berichten echt. POSTS dient alleen als skeleton tijdens het laden.\n    const rauw = this.state.posts || (laden ? POSTS : []);\n    const bron = rauw.map((p) => {\n      const reacties = (p.reacties || []).map((r) => ({\n        auteur: r.auteur || \"Onbekend\",\n        initialen: r.initialen || initialen(r.auteur),\n        tijd: r.tijd || tijdKort(r.datum),\n        tekst: r.tekst || \"\",\n        heeftTekst: !!r.tekst,\n        href: r.href,\n        nieuw: typeof r.nieuw === \"boolean\" ? r.nieuw : this.isNieuw(r.datum)\n      }));\n      return {\n        id: p.id,\n        titel: p.titel,\n        auteur: p.auteur || \"\",\n        initialen: p.initialen || initialen(p.auteur),\n        tijd: p.tijd || tijdKort(p.datum),\n        samenvatting: p.samenvatting || \"\",\n        href: p.href,\n        reacties,\n        // Het echte aantal komt van de overzichtspagina; de feed kent alleen\n        // de reacties van de laatste dagen.\n        totaal: typeof p.reactieTotaal === \"number\" ? Math.max(p.reactieTotaal, reacties.length) : reacties.length,\n        nieuw: reacties.filter((r) => r.nieuw).length\n      };\n    });\n\n    const nieuwTotaal = bron.reduce((s, p) => s + p.nieuw, 0);\n    const metReacties = bron.filter((p) => p.totaal > 0);\n\n    const posts = bron.filter((p) => (filter === \"nieuw\" ? p.nieuw > 0 : true));\n    const gesorteerd = filter === \"reacties\"\n      ? posts.slice().sort((a, b) => b.totaal - a.totaal)\n      : posts;\n\n    return {\n      datum: dagen[d.getDay()] + \" \" + d.getDate() + \" \" + maanden[d.getMonth()],\n      isLid: !!this.state.profiel,\n      nietLid: !this.state.profiel,\n      lidNaam: this.state.profiel ? this.state.profiel.naam : \"\",\n      lidUrl: this.state.profiel ? this.state.profiel.url : NLFR,\n      lidInitialen: this.state.profiel ? initialen(this.state.profiel.naam) : \"\",\n      aanmeldOpen: this.state.aanmeldOpen,\n      openAanmelden: () => this.setState({ aanmeldOpen: true }),\n      sluitAanmelden: () => this.setState({ aanmeldOpen: false }),\n      vergeetProfiel: this.vergeetProfiel,\n      nieuwBerichtUrl: NLFR + \"/profiles/blog/new\",\n      aanmeldUrl: aanmeldUrl(this.state.ouderUrl),\n      inschrijfUrl: inschrijfUrl(this.state.ouderUrl),\n      wachtwoordUrl: wachtwoordUrl(this.state.ouderUrl),\n      opStart: scherm === \"start\",\n      opBerichten: scherm === \"berichten\",\n      opActueel: scherm === \"actueel\",\n      actueelUrl: ACTUEEL_URL,\n      actueelRef: this.actueelRef,\n      actueelGeladen: this.stuurVenster,\n      actueelStijl:\n        \"display: block; width: 100%; height: \" + this.state.actueelHoogte + \"px; border: 0; background: #fdf9f8;\",\n      nieuwTotaal: nieuwTotaal,\n      knopSub: laden\n        ? \"Reacties worden opgehaald…\"\n        : nieuwTotaal\n        ? \"Met alle reacties eronder — \" + nieuwTotaal + \" nieuw\"\n        : bron.length\n        ? bron.length + \" berichten, met alle reacties eronder\"\n        : \"Met alle reacties eronder\",\n      naarBerichten: () => this.setState({ scherm: \"berichten\" }),\n      laden: laden,\n      heeftFout: !!fout,\n      leegOfFout: !laden && gesorteerd.length === 0,\n      leegTitel: fout ? \"Berichten niet opgehaald\" : filter === \"nieuw\" ? \"Geen nieuwe reacties\" : \"Nog geen berichten\",\n      leegTekst: fout\n        ? \"De verbinding met Nederlanders.fr lukte niet. Probeer het zo nog eens, of ga rechtstreeks naar de site.\"\n        : filter === \"nieuw\"\n        ? \"U bent bij. Kies “Alles” om alle recente berichten te zien.\"\n        : \"Er zijn op dit moment geen berichten opgehaald.\",\n      opnieuw: () => { this.setState({ laden: true, fout: null }); this.haal(); },\n      statusStijl:\n        \"display: flex; align-items: center; gap: 8px; margin: 12px 12px 0; padding: 9px 13px; border-radius: 11px; \" +\n        (fout\n          ? \"background: rgba(128,0,0,.06); border: 1px solid rgba(128,0,0,.22);\"\n          : laden\n          ? \"background: rgba(21,24,26,.04); border: 1px solid rgba(21,24,26,.10);\"\n          : \"background: rgba(47,107,58,.08); border: 1px solid rgba(47,107,58,.22);\"),\n      stipStijl:\n        \"width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; background: \" +\n        (fout ? \"#800000\" : laden ? \"#a99e9a\" : \"#2f6b3a\") + \";\",\n      statusTekstStijl:\n        \"flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 600; line-height: 1.35; color: \" +\n        (fout ? \"#5f0000\" : laden ? \"#6f6663\" : \"#24512e\") + \";\",\n      sindsRegel: laden\n        ? \"Reacties worden opgehaald…\"\n        : fout\n        ? \"Even geen verbinding met de site — probeer het zo nog eens.\"\n        : nieuwTotaal\n        ? nieuwTotaal + (nieuwTotaal === 1 ? \" nieuwe reactie\" : \" nieuwe reacties\") + \" sinds uw laatste bezoek\"\n        : \"Alles gelezen — geen nieuwe reacties sinds uw laatste bezoek.\",\n      heeftLevendig: metReacties.length > 0,\n      levendig: metReacties.slice(0, 3).map((p) => ({\n        titel: p.titel,\n        reactieLabel: p.totaal === 1 ? \"1 reactie\" : p.totaal + \" reacties\",\n        heeftNieuw: p.nieuw > 0,\n        laatste: p.reacties.length\n          ? \"laatste reactie \" + p.reacties[p.reacties.length - 1].tijd\n          : \"door \" + p.auteur\n      })),\n      tegels: [\n        { titel: \"Onderwerpen\", sub: \"Wonen, geld, zorg, auto\", href: \"https://www.nederlanders.fr\" },\n        { titel: \"Meedoen\", sub: \"Bericht plaatsen of reageren\", href: \"https://www.nederlanders.fr\" },\n        { titel: \"Diensten\", sub: \"Tools en rekenhulpen\", href: \"https://www.nederlanders.fr\" },\n        { titel: \"Mijn NLFR\", sub: \"Profiel en instellingen\", href: \"https://www.nederlanders.fr\" }\n      ],\n      tabs: [\n        { label: \"Start\", stijl: this.tabStijl(scherm === \"start\"), kies: () => this.setState({ scherm: \"start\" }) },\n        { label: \"Berichten\", stijl: this.tabStijl(scherm === \"berichten\"), kies: () => this.setState({ scherm: \"berichten\" }) },\n        { label: \"Actueel\", stijl: this.tabStijl(scherm === \"actueel\"), kies: () => this.setState({ scherm: \"actueel\" }) }\n      ],\n      filters: [\n        { label: \"Alles\", stijl: this.chipStijl(filter === \"alles\"), kies: () => this.setState({ filter: \"alles\" }) },\n        { label: \"Nieuwe reacties\", stijl: this.chipStijl(filter === \"nieuw\"), kies: () => this.setState({ filter: \"nieuw\" }) },\n        { label: \"Meest besproken\", stijl: this.chipStijl(filter === \"reacties\"), kies: () => this.setState({ filter: \"reacties\" }) }\n      ],\n      zichtbaar: gesorteerd.map((p) => {\n        const isOpen = !!open[p.id];\n        const draad = this.state.draden[p.id];\n        const vol = draad && draad.reacties;\n        // Volledige draad zodra die binnen is; anders wat de feed gaf.\n        const lijst = vol\n          ? draad.reacties.map((r) => ({\n              auteur: r.auteur,\n              initialen: initialen(r.auteur),\n              tijd: r.tijdTekst || tijdKort(r.datum),\n              tekst: r.tekst,\n              heeftTekst: !!r.tekst,\n              href: r.href,\n              avatar: r.avatar || \"\",\n              heeftAvatar: !!r.avatar,\n              nieuw: false\n            }))\n          : p.reacties;\n        return {\n          ...p,\n          open: isOpen,\n          magReageren: !!this.state.profiel,\n          vraagtAanmelden: !this.state.profiel,\n          // Een gewone navigatie neemt de Ning-sessie mee, dus wie is\n          // aangemeld landt direct in het reactievak.\n          reageerHref: p.href + \"#comments\",\n          vraagAanmelden: () => this.setState({ aanmeldOpen: true }),\n          heeftReacties: p.totaal > 0,\n          geenReacties: p.totaal === 0,\n          toggle: () => {\n            const wordtOpen = !this.state.open[p.id];\n            this.setState((s) => ({ open: { ...s.open, [p.id]: wordtOpen } }));\n            if (wordtOpen) this.haalDraad(p.id);\n          },\n          draadLaadt: !!(draad && draad.laden),\n          draadFout: !!(draad && draad.fout),\n          draadNotitie: vol\n            ? draad.reacties.length + (draad.reacties.length === 1 ? \" reactie\" : \" reacties\") + \" — volledige draad\"\n            : \"\",\n          heeftNotitie: !!vol,\n          toggleLabel: isOpen ? \"Sluit ▲\" : \"Toon ▼\",\n          reactieRegel:\n            (p.totaal === 1 ? \"1 reactie\" : p.totaal + \" reacties\") +\n            (p.nieuw ? \" · \" + p.nieuw + \" nieuw\" : \"\"),\n          gezichten: p.reacties.slice(0, 3).map((r, i) => ({\n            initialen: r.initialen,\n            stijl: \"display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(128,0,0,.10); border: 2px solid #fff; font-family: 'Poppins', sans-serif; font-size: 9.5px; font-weight: 700; color: #800000; margin-left: \" + (i ? \"-8px\" : \"0\") + \";\"\n          })),\n          reacties: lijst.map((r, i) => ({\n            ...r,\n            blokStijl: \"padding: 11px 0 12px; border-top: \" + (i ? \"1px solid rgba(21,24,26,.07)\" : \"0\") + \"; border-left: 2px solid \" + (r.nieuw ? \"rgba(47,107,58,.45)\" : \"rgba(128,0,0,.16)\") + \"; padding-left: 11px; margin-top: \" + (i ? \"0\" : \"4px\") + \";\",\n            avatarStijl: \"display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(128,0,0,.08); font-family: 'Poppins', sans-serif; font-size: 9px; font-weight: 700; color: #800000;\"\n          }))\n        };\n      }),\n      heeftWezen: (this.state.wezen || []).length > 0,\n      wezen: (this.state.wezen || []).slice(0, 8).map((w) => ({\n        auteur: w.auteur || \"Onbekend\",\n        tijd: tijdKort(w.datum),\n        titel: w.label || \"reageerde op een ouder bericht\",\n        href: w.href\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
