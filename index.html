<title>Nederlanders.fr mobiel is verhuisd naar InfoPoche</title>
<script>
/* Los geopend (nieuwsbrief, snelkoppeling): meteen door naar InfoPoche.
   In het kader op nederlanders.fr/m mag een pagina de bezoeker niet zelf wegsturen; daar staat de knop hieronder. */
(function () {
  var DOEL = "https://infopoche.fr/";
  try { if (window.top === window.self) { window.location.replace(DOEL); return; } } catch (e) {}
  try { window.top.location.href = DOEL; } catch (e) {}
})();
</script>
